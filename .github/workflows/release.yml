name: Release

on:
  push:
    tags: ["v*"]
  # Only to publish a tag without signing secrets on purpose: run it for the tag with allow_unsigned ticked.
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: Publish an ad-hoc signed, not notarized build if the signing secrets are missing
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    # The signing and notary secrets live in this environment, which only v* tags may use (docs/RELEASING.md).
    environment: release
    env:
      # Only whether the certificate is set, for the steps' conditions: without it the build stays ad hoc. The
      # certificate itself is given to the one step that imports it, not to every step of the job.
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      ALLOW_UNSIGNED: ${{ inputs.allow_unsigned == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # First: the README, the cask, the issue forms and the app's links all point at REPO_SLUG, so a release
      # published anywhere else leaves its users with dead links (docs/RELEASING.md, Before the first tag).
      - name: Check the repository
        run: |
          . scripts/product.env
          if [ "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$REPO_SLUG" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::This is $GITHUB_REPOSITORY, but scripts/product.env says $REPO_SLUG, where the README, the cask and the app's links point. Rename the repository first (docs/RELEASING.md)."
            exit 1
          fi
      - name: Stop without signing secrets
        if: env.HAS_CERT != 'true' && env.ALLOW_UNSIGNED != 'true'
        run: |
          echo "::error::Signing secrets are missing; a release is published only when it can be notarized (docs/RELEASING.md). To publish an ad-hoc build anyway, run this workflow by hand for the tag with allow_unsigned."
          exit 1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app && swift --version
      - name: Validate release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo 'Release tag must be v<major.minor.patch> or v<major.minor.patch-rc.N> and match VERSION.' >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            /^## / {
              if (selected) exit
              if ($2 == version) { selected = 1; found = 1 }
              next
            }
            selected { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes_file"
          # The entry's heading carries the release date, like the ones before it: "## 1.0.0 — 2026-10-05".
          # A release candidate is headed the same way: "## 1.0.0-rc.1 — 2026-09-29". Only the entry headed with the version
          # becomes the notes, so the release after its candidates renames their entry to its own heading (docs/RELEASING.md).
          if ! grep -qE "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            echo "CHANGELOG.md: the $version heading needs its release date, as in \"## $version — $(date -u +%F)\"." >&2
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "CHANGELOG.md has no release notes for $version." >&2
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Rosetta
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      # Signing: a throwaway keychain holding the Developer ID certificate and the notary credentials.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | head -n 1 | sed -E 's/.*"(.*)"/\1/')
          [ -n "$identity" ] || { echo "No Developer ID Application identity for team $APPLE_TEAM_ID in the certificate." >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$AC_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials release --key "$RUNNER_TEMP/notary.p8" --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEYCHAIN_PROFILE=release" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/build-app.sh "$(cat VERSION)"
      - name: Verify
        run: scripts/verify-build.sh
      - name: Notarize and staple
        run: scripts/notarize.sh
      - name: Package
        run: scripts/package.sh "$(cat VERSION)" && scripts/verify-build.sh
      - name: Say when the build is not notarized (allow_unsigned)
        if: env.HAS_CERT != 'true'
        run: |
          {
            echo
            echo "This build is ad-hoc signed and not notarized, so macOS blocks it the first time. To open it: unzip it and"
            echo "drag Baton.app to /Applications in Finder before you open it (opened where it was unzipped, it runs from a"
            echo "temporary copy that its launchers would point into). Open it once (macOS refuses), then go to"
            echo "System Settings → Privacy & Security and click Open Anyway next to Baton. Or build it from source with"
            echo "\`make install\`, which isn't quarantined."
          } >> "$RUNNER_TEMP/release-notes.md"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/product.env
          version=$(cat VERSION)
          # A release may carry a name of its own; docs/launch/repo-metadata.md lists them.
          case "${version%%-*}" in
            1.0.0) title="$PRODUCT_NAME $version — first leg" ;;
            *) title="$PRODUCT_NAME $version" ;;
          esac
          # A release candidate (-rc.N) is a prerelease: never marked Latest, and its title says so. So is a build that
          # isn't notarized (allow_unsigned): Latest, the README's badge and the cask's livecheck are for signed releases.
          prerelease=()
          if [[ "$version" == *-rc.* ]]; then
            title="$title, release candidate"
            prerelease=(--prerelease)
          elif [[ "$HAS_CERT" != true ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "build/$ARCHIVE_STEM-$GITHUB_REF_NAME.zip" build/SHA256SUMS.txt \
            --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
      - name: Remove the signing keychain
        if: always() && env.NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$NOTARY_KEYCHAIN"

  # Points the Homebrew tap at this release; skipped with a warning without HOMEBREW_TAP_PAT. A release published with
  # GITHUB_TOKEN starts no other workflow, so this can't wait for a release event. Skipped for a release candidate and
  # for an allow_unsigned run: the cask follows signed final releases only.
  tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-rc.') && inputs.allow_unsigned != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/bump-cask.yml
    with:
      tag: ${{ github.ref_name }}
    # No secrets passed: the bump job reads the tap token from the release environment itself.
