name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Set for every step, so an empty one means the secret is missing and the build stays ad hoc.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app && swift --version
      - name: Validate release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo 'Release tag must be v<major.minor.patch> and match VERSION.' >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            /^## / {
              if (selected) exit
              if ($2 == version) { selected = 1; found = 1 }
              next
            }
            selected { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes_file"
          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "CHANGELOG.md has no release notes for $version." >&2
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Rosetta
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      # Signing: a throwaway keychain holding the Developer ID certificate and the notary credentials.
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | head -n 1 | sed -E 's/.*"(.*)"/\1/')
          [ -n "$identity" ] || { echo "No Developer ID Application identity for team $APPLE_TEAM_ID in the certificate." >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$AC_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials release --key "$RUNNER_TEMP/notary.p8" --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEYCHAIN_PROFILE=release" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/build-app.sh "$(cat VERSION)"
      - name: Verify
        run: scripts/verify-build.sh
      - name: Notarize and staple
        run: scripts/notarize.sh
      - name: Package
        run: scripts/package.sh "$(cat VERSION)" && scripts/verify-build.sh
      - name: Say when the build is not notarized
        if: env.MACOS_CERTIFICATE == ''
        run: |
          {
            echo
            echo "This build is ad-hoc signed and not notarized. After downloading, open it once with"
            echo "System Settings → Privacy & Security → Open Anyway, or build it from source with \`make install\`."
          } >> "$RUNNER_TEMP/release-notes.md"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/product.env
          gh release create "$GITHUB_REF_NAME" "build/$ARCHIVE_STEM-$GITHUB_REF_NAME.zip" build/SHA256SUMS.txt \
            --title "$PRODUCT_NAME $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Remove the signing keychain
        if: always() && env.NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$NOTARY_KEYCHAIN"
